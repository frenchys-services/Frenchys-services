<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="version" content="1.3">
<title>Thank you – Frenchys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  GOOGLE ADS CONVERSION TAG GOES HERE
  In Google Ads: Goals > Conversions > New conversion action > Website.
  Google gives you a "Google tag" snippet (it starts with AW-XXXXXXXXX).
  Paste that whole snippet right below this comment, inside <head>.
  The order total is available as the "value" in the page address (?value=30).
-->

<style>
:root{--bg:#fbfbfd;--surface:#fff;--ink:#0b1020;--muted:#5a6275;--line:#e4e7ee;--accent:#3355ff;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#070a14;--surface:#0f1424;--ink:#f3f5fb;--muted:#98a1b8;--line:#1f2740;--accent:#6b87ff;--on-accent:#070a14}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 'Manrope',system-ui,sans-serif;display:grid;place-items:center;padding:1.4rem}
.box{max-width:30rem;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2.4rem 1.6rem}
.ok{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 1.2rem;font:700 2rem 'Sora',sans-serif}
h1{font:700 1.7rem 'Sora',sans-serif;margin:0 0 .6rem;letter-spacing:-.02em}
p{color:var(--muted);margin:.5rem 0}
.cta{display:inline-block;margin-top:1.4rem;background:var(--accent);color:var(--on-accent);padding:.9rem 1.6rem;border-radius:999px;text-decoration:none;font-weight:600}
small{display:block;margin-top:1.6rem;color:var(--muted);opacity:.8}
</style>
</head>
<body>
<main class="box">
<div class="ok" aria-hidden="true">&#10003;</div>
<h1>Thank you! Your order is in.</h1>
<p>I’ll email you soon to confirm your packages, the price, and the timeline.</p>
<p>No payment is taken on this site.</p>
<a class="cta" href="./">Back to Frenchys</a>
<small>Version 1.3</small>
</main>
</body>
</html>
